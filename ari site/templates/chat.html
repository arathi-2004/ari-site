<!DOCTYPE html>
<html lang="ml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>കർഷക കൂട്ടായ്മ | Rice Doctor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Chat specific styles */
        .chat-container {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 70vh;
        }

        .chat-header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem;
            text-align: center;
        }

        .messages-area {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            max-width: 80%;
            align-self: flex-start;
        }

        .message.mine {
            align-self: flex-end;
            background-color: #dbf6e6;
            /* Light green */
        }

        .message-user {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--secondary-color);
            margin-bottom: 4px;
        }

        .message-text {
            color: #333;
            line-height: 1.4;
        }

        .message-time {
            font-size: 0.75rem;
            color: #999;
            text-align: right;
            margin-top: 4px;
        }

        .input-area {
            padding: 1rem;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .name-input {
            width: 120px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
        }

        .message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
        }

        .send-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .send-btn:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>

<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo-area">
                <a href="/">
                    <img src="{{ url_for('static', filename='title.png') }}" alt="Rice Doctor Title"
                        class="title-image">
                </a>
                <nav>
                    <a href="/" class="nav-link">ഹോം</a>
                    <a href="/chat" class="nav-link active">കൂട്ടായ്മ</a>
                    <a href="/contact" class="nav-link">ബന്ധപ്പെടുക</a>

                    {% if session.get('username') %}
                    <span class="nav-user">👤 {{ session['username'] }}</span>
                    <a href="{{ url_for('logout') }}" class="nav-link logout-btn">Logout</a>
                    {% else %}
                    <a href="{{ url_for('login') }}" class="nav-link login-btn">Login</a>
                    {% endif %}
                </nav>
            </div>
    </header>

    <main class="main-content">
        <div class="chat-container">
            <div class="chat-header">
                <h2>കർഷക കൂട്ടായ്മ</h2>
                <p>സംശയങ്ങളും അറിവുകളും പങ്കുവെക്കാം</p>
            </div>

            <div class="messages-area" id="messages-area">
                <!-- Messages will load here -->
                <div class="message">
                    <div class="message-user">Admin</div>
                    <div class="message-text">സ്വാഗതം! നിങ്ങളുടെ സംശയങ്ങൾ ഇവിടെ ചോദിക്കാം.</div>
                    <div class="message-time">Now</div>
                </div>
            </div>

            <div class="input-area">
                <!-- Username is auto-filled by backend session -->
                <input type="text" id="message-text" class="message-input" placeholder="സന്ദേശം എഴുതുക..." required>
                <button id="send-btn" class="send-btn">അയക്കുക</button>
            </div>
        </div>
    </main>

    <script>
        const messagesArea = document.getElementById('messages-area');
        const messageInput = document.getElementById('message-text');
        const sendBtn = document.getElementById('send-btn');
        let knownMessages = new Set();

        // Fetch current session username injected by jinja
        const currentUser = "{{ session.get('username') }}";

        function scrollToBottom() {
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        async function loadMessages() {
            try {
                const response = await fetch('/api/messages');
                const messages = await response.json();

                messagesArea.innerHTML = '';
                messages.forEach(msg => {
                    const isMine = msg.username === currentUser;
                    const div = document.createElement('div');
                    div.className = `message ${isMine ? 'mine' : ''}`;
                    div.innerHTML = `
                        <div class="message-user">${msg.username}</div>
                        <div class="message-text">${msg.text}</div>
                        <div class="message-time">${msg.timestamp}</div>
                    `;
                    messagesArea.appendChild(div);
                });

                // Only scroll if near bottom or first load (omitted complex logic for MVP)
            } catch (e) {
                console.error("Error loading messages", e);
            }
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            try {
                await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Username is omitted; backend gets it from session securely
                    body: JSON.stringify({ text })
                });
                messageInput.value = '';
                loadMessages(); // Reload immediately
                setTimeout(scrollToBottom, 100);
            } catch (e) {
                alert('Error sending message');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Poll every 3 seconds
        setInterval(loadMessages, 3000);
        loadMessages();
    </script>
</body>

</html>
